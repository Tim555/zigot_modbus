version: '3'

tasks:
  run:
    desc: Poll the local development Modbus TCP server
    cmds:
      - zig build
      - ./zig-out/bin/zigot-modbus -p 5020 -r 11 -c 2 {{.CLI_ARGS}} 127.0.0.1

  run-server:
    desc: Build and run the Zig Modbus TCP server on 127.0.0.1:5020
    cmds:
      - zig build run-server

  unit-test:
    desc: Run the Zig test suite
    cmds:
      - zig build test
