name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tests
      - name: Test Debug
        run: zig build test
      - name: Test ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe
      - name: Cross-compile tests
        run: zig build check -Dtarget=aarch64-linux
