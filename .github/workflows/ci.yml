name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tests
      - name: Build example
        run: zig build
      - name: Test Debug
        run: zig build test
      - name: Test ReleaseSafe
        run: zig build test -Doptimize=ReleaseSafe
      - name: Cross-compile tests
        run: zig build check -Dtarget=aarch64-linux
  rtu-interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent Modbus stack
        run: python -m pip install -r test_server/interop-requirements.txt
      - name: Test RTU interoperability
        run: python test_server/interop.py --rtu --optimize ${{ matrix.optimize }} --artifacts interop-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtu-interop-${{ matrix.optimize }}
          path: interop-artifacts
