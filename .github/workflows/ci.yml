name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig build.zig.zon src tests

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build CLI and development server
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all
      - name: Library, public API, CLI, TCP server, and RTU tests
        if: ${{ !cancelled() }}
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - name: Decoder mutation smoke tests
        if: ${{ !cancelled() }}
        run: zig build fuzz-smoke -Doptimize=${{ matrix.optimize }} --summary all

  downstream:
    name: Downstream package consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch archive and build an independent consumer
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zigot_modbus.tar.gz"
          git archive --format=tar.gz --prefix=zigot_modbus/ --output="$archive" HEAD
          consumer=$(mktemp -d "$RUNNER_TEMP/modbus-consumer.XXXXXX")
          cd "$consumer"
          zig init
          zig fetch --save=zigot_modbus "$archive"
          cat > build.zig <<'ZIG'
          const std = @import("std");

          pub fn build(b: *std.Build) void {
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const dep = b.dependency("zigot_modbus", .{
                  .target = target,
                  .optimize = optimize,
              });
              const exe = b.addExecutable(.{
                  .name = "consumer",
                  .root_module = b.createModule(.{
                      .root_source_file = b.path("src/main.zig"),
                      .target = target,
                      .optimize = optimize,
                      .imports = &.{.{ .name = "zigot_modbus", .module = dep.module("zigot_modbus") }},
                  }),
              });
              b.installArtifact(exe);
          }
          ZIG
          cat > src/main.zig <<'ZIG'
          const modbus = @import("zigot_modbus");

          pub fn main() !void {
              const checksum = modbus.modbus_codec.crc16(&.{ 1, 3, 0, 0, 0, 10 });
              if (checksum != 0xcdc5) return error.InvalidChecksum;
              var frame: [12]u8 = undefined;
              const length = try modbus.modbus_codec.encode_read_holding_registers_request(0, 1, 0, 10, &frame);
              if (length != frame.len) return error.InvalidRequestLength;
          }
          ZIG
          zig build -Doptimize=ReleaseSafe --summary all
          test "$(find zig-out/bin -mindepth 1 -maxdepth 1 -printf '%f\n')" = consumer
          ./zig-out/bin/consumer

  cross-compile:
    name: Cross-compile aarch64-linux (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build check -Dtarget=aarch64-linux -Doptimize=${{ matrix.optimize }} --summary all

  interop:
    name: Interop (${{ matrix.suite.name }}, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
        suite:
          - name: tcp-client
            script: test_server/interop.py
            args: ''
          - name: rtu-client
            script: test_server/interop.py
            args: --rtu
          - name: tcp-server
            script: test_server/server_interop.py
            args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test_server/interop-requirements.txt
      - name: Install independent Modbus stack
        run: python -m pip install -r test_server/interop-requirements.txt
      - name: Run independent-stack interoperability tests
        run: python ${{ matrix.suite.script }} ${{ matrix.suite.args }} --optimize ${{ matrix.optimize }} --artifacts interop-artifacts
      - name: Retain interoperability reports and logs
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: interop-${{ matrix.suite.name }}-${{ matrix.optimize }}
          path: |
            interop-artifacts/*.json
            interop-artifacts/*.log
            interop-artifacts/*.zig
          retention-days: 14
          if-no-files-found: warn
